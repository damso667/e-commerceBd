# ============================================================
#  Configuration E-commerce
#  Aucune valeur sensible ici : tout vient du fichier .env
#  (ou des variables d'environnement du serveur en production).
# ============================================================

spring.application.name=E-commerce

# ---- Chargement du fichier .env --------------------------------------------
# Spring Boot sait importer un fichier de proprietes arbitraire.
# Le suffixe [.properties] lui dit comment parser le fichier .env.
# "optional:" = l'application demarre meme sans .env (cas de la production,
# ou les valeurs viennent des variables d'environnement du serveur).
spring.config.import=optional:file:./.env[.properties]

# ---- Datasource (Supabase / PostgreSQL) ------------------------------------
# prepareThreshold=0 est OBLIGATOIRE avec le pooler Supabase en mode
# "transaction" (port 6543) : ce pooler ne supporte pas les prepared
# statements cote serveur de PgJDBC.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le pooler Supabase limite le nombre de connexions : on reste modeste.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ---- JPA / Hibernate --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ---- Serveur ----------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=always

# ---- Journalisation ---------------------------------------------------------
logging.level.com.example.E_commerce=DEBUG

# ---- Back-office ------------------------------------------------------------
# Seuil d'alerte "stock faible" du tableau de bord.
app.admin.seuil-stock-faible=${ADMIN_SEUIL_STOCK_FAIBLE:5}
# Garde-fou : taille de page maximale, pour qu'un ?size=100000 ne puisse pas
# contourner la pagination.
spring.data.web.pageable.max-page-size=200
spring.data.web.pageable.default-page-size=20

# ---- CORS -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ============================================================
#  PAIEMENT
#  app.paiement.mode = simulation | reel
#  C'est LA seule ligne a changer pour passer en production
#  (une fois les cles des operateurs renseignees dans .env).
# ============================================================
app.paiement.mode=${PAIEMENT_MODE:simulation}
app.paiement.devise=XAF
app.paiement.delai-expiration-minutes=15
app.paiement.webhook-secret=${PAIEMENT_WEBHOOK_SECRET:dev-secret-a-changer}

# ---- Parametres propres a la simulation -------------------------------------
app.paiement.simulation.delai-reponse-ms=${PAIEMENT_SIMULATION_DELAI_MS:4000}
app.paiement.simulation.taux-echec-aleatoire=0.0

# ---- MTN Mobile Money (utilise uniquement quand mode=reel) ------------------
app.paiement.mtn.base-url=${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
app.paiement.mtn.subscription-key=${MTN_MOMO_SUBSCRIPTION_KEY:}
app.paiement.mtn.api-user=${MTN_MOMO_API_USER:}
app.paiement.mtn.api-key=${MTN_MOMO_API_KEY:}
app.paiement.mtn.target-environment=${MTN_MOMO_TARGET_ENVIRONMENT:sandbox}
app.paiement.mtn.callback-url=${MTN_MOMO_CALLBACK_URL:http://localhost:8080/api/paiements/webhook/MTN_MOMO}

# ---- Orange Money (utilise uniquement quand mode=reel) ----------------------
app.paiement.orange.base-url=${ORANGE_MONEY_BASE_URL:https://api.orange.com}
app.paiement.orange.client-id=${ORANGE_MONEY_CLIENT_ID:}
app.paiement.orange.client-secret=${ORANGE_MONEY_CLIENT_SECRET:}
app.paiement.orange.merchant-key=${ORANGE_MONEY_MERCHANT_KEY:}
app.paiement.orange.callback-url=${ORANGE_MONEY_CALLBACK_URL:http://localhost:8080/api/paiements/webhook/ORANGE_MONEY}
