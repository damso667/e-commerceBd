# ============================================================
#  Configuration E-commerce
#  Aucune valeur sensible ici : tout vient du fichier .env
#  (ou des variables d'environnement du serveur en production).
# ============================================================

spring.application.name=E-commerce

# ---- Chargement du fichier .env --------------------------------------------
# Spring Boot sait importer un fichier de proprietes arbitraire.
# Le suffixe [.properties] lui dit comment parser le fichier .env.
# "optional:" = l'application demarre meme sans .env (cas de la production,
# ou les valeurs viennent des variables d'environnement du serveur).
spring.config.import=optional:file:./.env[.properties]

# ---- Datasource (Supabase / PostgreSQL) ------------------------------------
# prepareThreshold=0 est OBLIGATOIRE avec le pooler Supabase en mode
# "transaction" (port 6543) : ce pooler ne supporte pas les prepared
# statements cote serveur de PgJDBC.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Le pooler Supabase limite le nombre de connexions : on reste modeste.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

# ---- JPA / Hibernate --------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ---- Serveur ----------------------------------------------------------------
# Render impose le port via la variable PORT ; SERVER_PORT reste la valeur
# de confort en local. L'ordre des deux replis compte.
server.port=${PORT:${SERVER_PORT:8080}}
server.error.include-message=always
# Derriere le proxy de Render, sans cela l'application se croit en http://
# et genere de mauvaises URL absolues.
server.forward-headers-strategy=framework
server.shutdown=graceful

# ---- Cookie de session ------------------------------------------------------
# Le front et l'API vivent sur deux domaines differents (localhost:4200 ou
# Vercel d'un cote, onrender.com de l'autre). Sans attribut SameSite,
# les navigateurs appliquent "Lax", et un cookie Lax n'est PAS envoye sur
# une requete vers un autre site : la session s'ouvre, puis toutes les
# routes protegees repondent 403. C'est exactement le symptome d'un panier
# qui refuse l'ajout alors que l'utilisateur vient de se connecter.
#
# SameSite=None impose Secure. Les navigateurs acceptent les cookies Secure
# sur http://localhost, qu'ils considerent comme un contexte sur, donc le
# developpement local fonctionne aussi.
server.servlet.session.cookie.same-site=${SESSION_SAME_SITE:none}
server.servlet.session.cookie.secure=${SESSION_SECURE:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=QALFSESSION
# Une session de paiement ne doit pas expirer pendant que le client valide
# son code USSD.
server.servlet.session.timeout=2h

# ---- Sonde de sante (health check Render) -----------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# probes desactivees : elles ajoutent les groupes liveness/readiness a la
# reponse, ce qui en dit plus que necessaire a un appelant anonyme. Render
# n'en a pas besoin, contrairement a Kubernetes.
management.endpoint.health.probes.enabled=false

# ---- Journalisation ---------------------------------------------------------
logging.level.com.example.E_commerce=${LOG_LEVEL:DEBUG}

# ---- Administrateur initial (profil prod uniquement) ------------------------
# Sans ces deux valeurs, aucun administrateur n'est cree en production et le
# back-office reste inaccessible : c'est voulu, mieux vaut cela qu'un compte
# au mot de passe devinable.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---- Depot de fichiers (logo, icone) ----------------------------------------
# 512 Ko suffisent largement pour un logo ; la limite basse evite qu'un
# depot accidentel de photo sature la memoire de l'instance gratuite.
# 1 Mo : plafond d'une photo de produit. Le logo reste limite a 512 Ko
# par son service ; ce reglage-ci est la borne du conteneur, qui doit
# laisser passer le plus gros des trois usages.
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB

# ---- Back-office ------------------------------------------------------------
# Seuil d'alerte "stock faible" du tableau de bord.
app.admin.seuil-stock-faible=${ADMIN_SEUIL_STOCK_FAIBLE:5}
# Garde-fou : taille de page maximale, pour qu'un ?size=100000 ne puisse pas
# contourner la pagination.
spring.data.web.pageable.max-page-size=200
spring.data.web.pageable.default-page-size=20

# ---- CORS -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ============================================================
#  PAIEMENT
#  app.paiement.mode = simulation | reel
#  C'est LA seule ligne a changer pour passer en production
#  (une fois les cles des operateurs renseignees dans .env).
# ============================================================
app.paiement.mode=${PAIEMENT_MODE:simulation}
app.paiement.devise=XAF
app.paiement.delai-expiration-minutes=15
app.paiement.webhook-secret=${PAIEMENT_WEBHOOK_SECRET:dev-secret-a-changer}

# ---- Parametres propres a la simulation -------------------------------------
app.paiement.simulation.delai-reponse-ms=${PAIEMENT_SIMULATION_DELAI_MS:4000}
app.paiement.simulation.taux-echec-aleatoire=0.0

# ---- MTN Mobile Money (utilise uniquement quand mode=reel) ------------------
app.paiement.mtn.base-url=${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
app.paiement.mtn.subscription-key=${MTN_MOMO_SUBSCRIPTION_KEY:}
app.paiement.mtn.api-user=${MTN_MOMO_API_USER:}
app.paiement.mtn.api-key=${MTN_MOMO_API_KEY:}
app.paiement.mtn.target-environment=${MTN_MOMO_TARGET_ENVIRONMENT:sandbox}
app.paiement.mtn.callback-url=${MTN_MOMO_CALLBACK_URL:http://localhost:8080/api/paiements/webhook/MTN_MOMO}

# ---- Orange Money (utilise uniquement quand mode=reel) ----------------------
app.paiement.orange.base-url=${ORANGE_MONEY_BASE_URL:https://api.orange.com}
app.paiement.orange.client-id=${ORANGE_MONEY_CLIENT_ID:}
app.paiement.orange.client-secret=${ORANGE_MONEY_CLIENT_SECRET:}
app.paiement.orange.merchant-key=${ORANGE_MONEY_MERCHANT_KEY:}
app.paiement.orange.callback-url=${ORANGE_MONEY_CALLBACK_URL:http://localhost:8080/api/paiements/webhook/ORANGE_MONEY}
